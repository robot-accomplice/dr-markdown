# Continuous integration.
#
# Every gate in this project was hand-run until now. An adversarial review found
# the consequences: the release artifact in build/ was two rounds stale and
# contained none of the security fixes it was supposed to ship, and the
# architecture data had drifted from the code for four commits. Neither needed a
# reviewer to catch — both are mechanical checks nobody had wired to anything.
#
# The rule this file follows: a gate that cannot fail is worse than no gate,
# because it reports success. Nothing here is allowed to skip silently.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A second push to the same ref makes the first run's answer irrelevant, and the
# e2e suite launches a browser per test — the older run is both wrong and
# expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The e2e package is the ONLY coverage of the frontend, and newTestBrowser
      # fails rather than skips when no browser is found. Assert the binary is
      # here before running anything, so a runner image change surfaces as a
      # clear failure instead of a confusing one deep in the suite.
      - name: Verify Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::No google-chrome on PATH. The e2e suite is the only coverage of the"
            echo "::error::frontend and must not pass by being absent. Install Chrome in this job."
            exit 1
          fi
          google-chrome --version

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # DRMD_SKIP_E2E is deliberately NOT set. It exists so a human can opt out
      # on a machine without a browser; CI is exactly where that opt-out must
      # never apply.
      - name: go test
        run: go test ./... -count=1

      # Recursive, deliberately. This globbed `frontend/dist/src/*.js` and so
      # checked 6 files while missing 13 — everything under src/markdown/ and
      # src/fidelity/, which is the entire markdown domain and the whole
      # byte-fidelity layer. A syntax error in either merged green.
      - name: Check frontend syntax
        run: |
          count=0
          while IFS= read -r f; do
            node --check "$f" || exit 1
            count=$((count + 1))
          done < <(find frontend/dist/src -name '*.js' -not -path '*/vendor/*')
          echo "checked $count frontend modules"
          if [ "$count" -lt 15 ]; then
            echo "::error::Only $count modules checked; the tree has more than that."
            echo "::error::The find above stopped matching, so this gate is not covering the frontend."
            exit 1
          fi

      # Vendored bundles are ~6 MB of third-party JavaScript fetched over the
      # network by tools/vendor.sh. Verifying the committed bytes against the
      # recorded digests is what makes a silent substitution or a corrupted
      # refresh visible.
      - name: Verify vendored bundle integrity
        run: ./tools/verify-vendor.sh

  # NOT RUN HERE, and why: `architext validate` needs the Architext CLI, which is
  # distributed as a binary outside this repository and is not on the runner.
  # Installing it in CI would add a toolchain dependency to a project whose
  # defining constraint is not having one. It stays a maintainer-run gate,
  # documented in CONTRIBUTING, and this comment exists so that omission is a
  # recorded decision rather than something that quietly fell off the list.

  # The shipping product, on the only platform it ships to.
  #
  # This job exists because the ubuntu job above compiles NONE of the
  # application's host layer. Every file implementing the window, the webview,
  # the asset scheme, the menu bar and the native dialogs is `*_darwin.go`, and
  # build constraints exclude all of them on Linux. Demonstrated rather than
  # assumed: inserting `var x int = "obviously wrong"` into host_darwin.go leaves
  # `GOOS=linux go build ./...` exiting 0, while GOOS=darwin fails. A syntax
  # error in the thing users actually run merged green.
  #
  # cgo against Cocoa and WebKit means this cannot be cross-compiled from the
  # Linux runner; it needs a real macOS image. They are free for public
  # repositories.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compiles the cgo host: Cocoa, WebKit, the Objective-C preamble.
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # The e2e package is EXCLUDED by listing packages, not by setting
      # DRMD_SKIP_E2E.
      #
      # That variable does not do what this job first claimed. newTestBrowser
      # honours it only when Chrome is ABSENT — its whole purpose is that a
      # missing browser must never pass silently — and macOS runners ship Chrome
      # at /Applications/Google Chrome.app, which chromeAvailable() checks by
      # name. So the suite ran here anyway, for 249 seconds, with the variable
      # set and visible in the log.
      #
      # It is excluded rather than run because it is browser coverage of the
      # frontend, it runs in full on the ubuntu job, and the same browser on a
      # different OS tests the runner rather than the product. What this job is
      # for is the Go code Linux cannot compile at all.
      - name: go test
        run: go test $(go list ./... | grep -v '/e2e$') -count=1

      # Packaging is production code and was verified only by hand. It compiles
      # the binary, assembles the bundle, substitutes VERSION into Info.plist,
      # generates the iconset through tools/genicon and converts it with
      # iconutil, ad-hoc signs, and builds a DMG. Every one of those can break
      # without a single test noticing.
      - name: Package the app
        run: ./tools/build-macos.sh

      # The bundle is only real if the OS agrees it is. `codesign --verify`
      # already runs inside the script; this checks the pieces a broken icon or
      # plist substitution would leave malformed, which signing does not.
      - name: Verify the bundle
        run: |
          APP=build/bin/dr-markdown.app
          test -d "$APP" || { echo "::error::no .app produced"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "::error::no Info.plist"; exit 1; }
          test -f "$APP/Contents/Resources/iconfile.icns" || { echo "::error::no icon"; exit 1; }
          test -f build/dr-markdown.dmg || { echo "::error::no DMG"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          version=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          expected=$(cat VERSION)
          if [ "$version" != "$expected" ]; then
            echo "::error::Info.plist says $version but VERSION says $expected"
            exit 1
          fi
          # An .icns that iconutil accepted can still be empty of the sizes the
          # Dock needs; the icon is generated per-size and that is worth checking.
          sips -g pixelWidth "$APP/Contents/Resources/iconfile.icns" >/dev/null
          echo "bundle ok: version $version"
